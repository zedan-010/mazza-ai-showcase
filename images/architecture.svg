<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="772" viewBox="0 0 1400 772" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><rect width="1400" height="772" fill="#FFFFFF"/><text x="48" y="70" font-size="26" font-weight="800" fill="#1B2A4A" >Mazza AI - system architecture</text><text x="48" y="96" font-size="15" font-weight="400" fill="#5B6B85" >Multi-tenant platform: AI agents answer calls and WhatsApp messages, then turn them into bookings, leads and revenue.</text><rect x="48" y="113" width="14" height="14" rx="4" fill="#526A95"/><text x="68" y="125" font-size="13" font-weight="400" fill="#5B6B85" >Parts I designed and built</text><rect x="248" y="113" width="14" height="14" rx="4" fill="#FAFBFC" stroke="#D5DCE8" stroke-width="1.5"/><text x="268" y="125" font-size="13" font-weight="400" fill="#5B6B85" >Platform and shared services</text><text x="48" y="170" font-size="12" font-weight="700" fill="#8592A8" letter-spacing="1">CHANNELS</text><rect x="48.0" y="184" width="314.0" height="72" rx="12" fill="#FFFFFF" stroke="#D5DCE8" stroke-width="1.5"/><text x="64.0" y="212" font-size="16" font-weight="700" fill="#1B2A4A" >Callers</text><text x="64.0" y="236" font-size="13" font-weight="400" fill="#5B6B85" >Realtime voice over WebRTC</text><rect x="378.0" y="184" width="314.0" height="72" rx="12" fill="#FFFFFF" stroke="#D5DCE8" stroke-width="1.5"/><text x="394.0" y="212" font-size="16" font-weight="700" fill="#1B2A4A" >WhatsApp customers</text><text x="394.0" y="236" font-size="13" font-weight="400" fill="#5B6B85" >Text, photos and PDFs via Meta Cloud API</text><rect x="708.0" y="184" width="314.0" height="72" rx="12" fill="#FFFFFF" stroke="#D5DCE8" stroke-width="1.5"/><text x="724.0" y="212" font-size="16" font-weight="700" fill="#1B2A4A" >Business teams</text><text x="724.0" y="236" font-size="13" font-weight="400" fill="#5B6B85" >Dashboard on web and mobile</text><rect x="1038.0" y="184" width="314.0" height="72" rx="12" fill="#FFFFFF" stroke="#D5DCE8" stroke-width="1.5"/><text x="1054.0" y="212" font-size="16" font-weight="700" fill="#1B2A4A" >Mazza operators</text><text x="1054.0" y="236" font-size="13" font-weight="400" fill="#5B6B85" >Internal operations console</text><path d="M700 266 v18 m-6 -7 l6 7 l6 -7" stroke="#8592A8" stroke-width="2" fill="none"/><rect x="48" y="300" width="300" height="296" rx="12" fill="#EEF2F8" stroke="#526A95" stroke-width="1.5"/><text x="64" y="328" font-size="16" font-weight="700" fill="#1B2A4A" >Voice runtime</text><rect x="193.6" y="314" width="88" height="19" rx="9.5" fill="#526A95"/><text x="237.6" y="327.5" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">BUILT BY ME</text><text x="64" y="352" font-size="13" font-weight="400" fill="#5B6B85" >Speech model + delegated</text><text x="64" y="371" font-size="13" font-weight="400" fill="#5B6B85" >reasoning, turn-taking,</text><text x="64" y="390" font-size="13" font-weight="400" fill="#5B6B85" >interruptions. Claims an</text><text x="64" y="409" font-size="13" font-weight="400" fill="#5B6B85" >immutable agent release</text><text x="64" y="428" font-size="13" font-weight="400" fill="#5B6B85" >with a short-lived signed</text><text x="64" y="447" font-size="13" font-weight="400" fill="#5B6B85" >ticket. No database</text><text x="64" y="466" font-size="13" font-weight="400" fill="#5B6B85" >credentials.</text><rect x="364" y="300" width="988" height="296" rx="16" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/><text x="384" y="332" font-size="17" font-weight="800" fill="#1B2A4A" >Next.js modular monolith</text><text x="650" y="332" font-size="14" font-weight="500" fill="#5B6B85" >authentication, permissions, API routes, server actions</text><rect x="384.0" y="350" width="308.0" height="112" rx="12" fill="#EEF2F8" stroke="#526A95" stroke-width="1.5"/><text x="400.0" y="378" font-size="16" font-weight="700" fill="#1B2A4A" >Voice control plane</text><rect x="584.8" y="364" width="88" height="19" rx="9.5" fill="#526A95"/><text x="628.8" y="377.5" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">BUILT BY ME</text><text x="400.0" y="402" font-size="13" font-weight="400" fill="#5B6B85" >Agent drafts and releases, reviewed</text><text x="400.0" y="421" font-size="13" font-weight="400" fill="#5B6B85" >knowledge, tool authorization,</text><text x="400.0" y="440" font-size="13" font-weight="400" fill="#5B6B85" >confirmation checks, telemetry</text><rect x="704.0" y="350" width="308.0" height="112" rx="12" fill="#EEF2F8" stroke="#526A95" stroke-width="1.5"/><text x="720.0" y="378" font-size="16" font-weight="700" fill="#1B2A4A" >WhatsApp agent</text><rect x="858.8" y="364" width="88" height="19" rx="9.5" fill="#526A95"/><text x="902.8" y="377.5" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">BUILT BY ME</text><text x="720.0" y="402" font-size="13" font-weight="400" fill="#5B6B85" >Tool-calling loop with vision,</text><text x="720.0" y="421" font-size="13" font-weight="400" fill="#5B6B85" >guardrails, human-control modes,</text><text x="720.0" y="440" font-size="13" font-weight="400" fill="#5B6B85" >debounce and locking</text><rect x="1024.0" y="350" width="308.0" height="112" rx="12" fill="#EEF2F8" stroke="#526A95" stroke-width="1.5"/><text x="1040.0" y="378" font-size="16" font-weight="700" fill="#1B2A4A" >Automations engine</text><rect x="1215.6" y="364" width="88" height="19" rx="9.5" fill="#526A95"/><text x="1259.6" y="377.5" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">BUILT BY ME</text><text x="1040.0" y="402" font-size="13" font-weight="400" fill="#5B6B85" >Triggers, steps, retries, signed</text><text x="1040.0" y="421" font-size="13" font-weight="400" fill="#5B6B85" >webhooks, encrypted credentials,</text><text x="1040.0" y="440" font-size="13" font-weight="400" fill="#5B6B85" >test mode</text><rect x="384.0" y="472" width="308.0" height="112" rx="12" fill="#FAFBFC" stroke="#D5DCE8" stroke-width="1.5"/><text x="400.0" y="500" font-size="16" font-weight="700" fill="#1B2A4A" >CRM and bookings</text><text x="400.0" y="524" font-size="13" font-weight="400" fill="#5B6B85" >Customers, leads, deals, availability,</text><text x="400.0" y="543" font-size="13" font-weight="400" fill="#5B6B85" >calendars, catalogs, 4 verticals</text><rect x="704.0" y="472" width="308.0" height="112" rx="12" fill="#EEF2F8" stroke="#526A95" stroke-width="1.5"/><text x="720.0" y="500" font-size="16" font-weight="700" fill="#1B2A4A" >Go-to-market engine</text><rect x="904.8" y="486" width="88" height="19" rx="9.5" fill="#526A95"/><text x="948.8" y="499.5" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">BUILT BY ME</text><text x="720.0" y="524" font-size="13" font-weight="400" fill="#5B6B85" >Prospect discovery, website research,</text><text x="720.0" y="543" font-size="13" font-weight="400" fill="#5B6B85" >fit scoring, cadences, campaigns</text><rect x="1024.0" y="472" width="308.0" height="112" rx="12" fill="#FAFBFC" stroke="#D5DCE8" stroke-width="1.5"/><text x="1040.0" y="500" font-size="16" font-weight="700" fill="#1B2A4A" >Billing and analytics</text><text x="1040.0" y="524" font-size="13" font-weight="400" fill="#5B6B85" >Subscriptions and usage, reports,</text><text x="1040.0" y="543" font-size="13" font-weight="400" fill="#5B6B85" >notifications</text><path d="M700 606 v18 m-6 -7 l6 7 l6 -7" stroke="#8592A8" stroke-width="2" fill="none"/><rect x="48" y="640" width="445.2" height="92" rx="12" fill="#FAFBFC" stroke="#D5DCE8" stroke-width="1.5"/><text x="64" y="668" font-size="16" font-weight="700" fill="#1B2A4A" >PostgreSQL (Supabase)</text><text x="64" y="692" font-size="13" font-weight="400" fill="#5B6B85" >Row-level security per organization,</text><text x="64" y="711" font-size="13" font-weight="400" fill="#5B6B85" >realtime updates, storage, 120+ migrations</text><rect x="509.2" y="640" width="318.0" height="92" rx="12" fill="#FAFBFC" stroke="#D5DCE8" stroke-width="1.5"/><text x="525.2" y="668" font-size="16" font-weight="700" fill="#1B2A4A" >Background workers</text><text x="525.2" y="692" font-size="13" font-weight="400" fill="#5B6B85" >Scheduled jobs, retries,</text><text x="525.2" y="711" font-size="13" font-weight="400" fill="#5B6B85" >notification delivery, watchdogs</text><rect x="843.2" y="640" width="508.8" height="92" rx="12" fill="#FAFBFC" stroke="#D5DCE8" stroke-width="1.5"/><text x="859.2" y="668" font-size="16" font-weight="700" fill="#1B2A4A" >External services</text><text x="859.2" y="692" font-size="13" font-weight="400" fill="#5B6B85" >LLMs (Claude, OpenAI), Meta WhatsApp,</text><text x="859.2" y="711" font-size="13" font-weight="400" fill="#5B6B85" >Clerk identity, Stripe billing, Resend email</text></svg>